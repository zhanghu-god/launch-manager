<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch Manager</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./shared/base.css">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./shared/base.js"></script>
  <script defer src="./main.js"></script>
</head>
<body>
  <section id="launcher-view" class="view">
    <header class="panel-header">
      <div class="panel-title">
        <span class="eyebrow">LAUNCHER</span>
        <h1>启动软件</h1>
        <span id="scan-dir-label" class="scan-dir"></span>
      </div>
      <div class="header-actions">
        <button id="rescan-launcher" class="icon-button" type="button" title="重新扫描" aria-label="重新扫描">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
        </button>
        <button id="open-settings" class="icon-button" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.4-2.6.1-.9-.1-.9 2-1.5-2-3.4-2.3.9a7 7 0 0 0-1.6-.9L15.2 3h-4l-.4 2.2a7 7 0 0 0-1.6.9l-2.3-.9-2 3.4 2 1.5-.1.9.1.9-2 1.5 2 3.4 2.3-.9c.5.4 1 .7 1.6.9l.4 2.2h4l.4-2.2a7 7 0 0 0 1.6-.9l2.3.9 2-3.4-2-1.5Z"/></svg>
        </button>
      </div>
    </header>
    <div id="app-list" class="app-list" role="listbox" aria-label="便携软件列表"></div>
    <div id="empty-state" class="empty-state" hidden>
      <strong>没有扫描到便携软件</strong>
      <span>当前目录：<span id="empty-scan-dir"></span></span>
      <span>点击右上刷新重试，或在设置中更改软件目录</span>
      <button id="empty-rescan" class="button secondary" type="button">重新扫描</button>
    </div>
    <footer class="hint-bar">↑↓ 选择 · Enter / 点击 启动 · 1–9 快速启动 · Esc 隐藏</footer>
  </section>

  <section id="settings-view" class="view" hidden>
    <header class="panel-header">
      <div class="panel-title">
        <span class="eyebrow">SETTINGS</span>
        <h1>设置</h1>
      </div>
      <button id="back-launcher" class="button secondary" type="button">返回</button>
    </header>
    <div class="settings-scroll">
      <form id="settings-form" class="settings-form">
        <label class="field">
          <span>软件目录</span>
          <input id="scan-dir" type="text" required>
        </label>
        <label class="field">
          <span>全局快捷键</span>
          <input id="hotkey" type="text" placeholder="Ctrl+Alt+Space" required>
        </label>
        <label class="check-field">
          <input id="autostart" type="checkbox">
          <span>开机自启（用户启动目录快捷方式）</span>
        </label>
        <label class="check-field">
          <input id="hide-after-launch" type="checkbox">
          <span>启动软件后隐藏面板</span>
        </label>
        <label class="check-field">
          <input id="maximize-on-launch" type="checkbox">
          <span>启动软件时最大化窗口（全屏）</span>
        </label>
        <label class="field">
          <span>主题</span>
          <select id="theme">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <fieldset class="webdav-fields">
          <legend>WebDAV 云备份</legend>
          <label class="check-field">
            <input id="wd-enabled" type="checkbox">
            <span>启用云备份（每小时 + 退出时自动增量备份）</span>
          </label>
          <label class="field">
            <span>服务器地址</span>
            <input id="wd-url" type="text" placeholder="https://dav.example.com/dav">
          </label>
          <label class="field">
            <span>账号</span>
            <input id="wd-username" type="text" autocomplete="username">
          </label>
          <label class="field">
            <span>密码</span>
            <input id="wd-password" type="password" autocomplete="current-password">
          </label>
          <label class="field">
            <span>远端根目录</span>
            <input id="wd-root" type="text" placeholder="rust-apps">
          </label>
        </fieldset>
        <p id="settings-error" class="form-error" role="alert" hidden></p>
        <div class="form-actions">
          <button id="rescan-btn" class="button secondary" type="button">重新扫描</button>
          <span class="spacer"></span>
          <button id="save-settings" class="button primary" type="submit">保存设置</button>
        </div>
      </form>

      <div class="update-card">
        <div class="update-head">
          <div>
            <strong>自动更新</strong>
            <span id="app-version" class="version-badge">v…</span>
          </div>
          <button id="check-update-btn" class="button secondary" type="button">检查更新</button>
        </div>
        <p id="update-status" class="update-status" role="status"></p>
      </div>

      <div class="update-card">
        <div class="update-head">
          <strong>云备份操作</strong>
          <div class="header-actions">
            <button id="wd-test-btn" class="button secondary" type="button">测试连接</button>
            <button id="wd-backup-btn" class="button primary" type="button">立即备份全部</button>
          </div>
        </div>
        <p id="wd-status" class="update-status" role="status"></p>
      </div>

      <div class="update-card">
        <div class="update-head">
          <strong>数据导入 / 导出 / 云恢复</strong>
        </div>
        <div id="data-app-list" class="data-app-list"></div>
        <p class="field-hint">导出为单个 JSON 文件；导入 / 云恢复前自动备份现有数据到 data/restore-backup-*。</p>
      </div>

      <div class="danger-zone">
        <button id="quit-btn" class="button danger-ghost" type="button">退出管理器</button>
      </div>
    </div>
  </section>

  <dialog id="update-dialog" class="modal">
    <div class="modal-body">
      <h2>更新已就绪</h2>
      <p class="confirm-text">新版本 <strong id="update-version"></strong> 已下载并通过校验。是否现在重启以完成更新？</p>
      <p class="field-hint">选择“稍后”会保留已下载更新，下次启动时继续提示。</p>
      <div class="modal-actions">
        <span class="spacer"></span>
        <button id="update-later-btn" class="button secondary" type="button">稍后</button>
        <button id="update-restart-btn" class="button primary" type="button">现在重启</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
